<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geospatial Data Science & AI Systems | Bagus Primohadi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="geosains.css">
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

  <!-- RADAR SWEEP BACKGROUND (CSS Only) -->
  <div class="radar-bg"></div>

  <!-- HEADER NAVIGATION -->
  <header class="sticky top-0 z-50 glass-header border-b border-cyan-900/50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl animate-spin-slow">🛰️</span>
        <h1 class="text-xl font-bold tracking-wider text-cyan-400 text-glow" id="nav-name">GEOSAINS AI HUB</h1>
      </div>
      <nav class="flex gap-6 text-sm font-semibold tracking-wide text-slate-400">
        <a href="index.html" class="nav-link hover:text-cyan-300 transition-colors">🌐 BERANDA</a>
        <a href="geosains.html" class="nav-link active hover:text-cyan-300 transition-colors">🛰️ GEOSAINS AI</a>
        <a href="education.html" class="nav-link hover:text-cyan-300 transition-colors">🎓 EDTECH</a>
      </nav>
    </div>
  </header>

  <!-- MAIN HERO SECTION -->
  <main class="flex-grow max-w-7xl mx-auto px-6 py-16">
    <div class="text-center max-w-4xl mx-auto mb-20 fade-in-up">
      <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full glass-panel text-cyan-300 text-xs font-bold tracking-widest mb-6 uppercase">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> Earth & Geospatial Data Scientist
      </div>
      <h2 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight" id="geo-title">
        <!-- Injected via JS -->
      </h2>
      <p class="text-lg md:text-xl text-slate-300 mb-10 leading-relaxed glass-panel p-6 rounded-2xl border-cyan-500/30" id="geo-about">
        <!-- Injected via JS -->
      </p>
    </div>

    <!-- OPERATIONAL SYSTEMS & IBF PROJECTS -->
    <div class="mb-20">
      <div class="flex items-center gap-4 mb-10 fade-in-up">
        <div class="h-[2px] flex-grow bg-gradient-to-r from-transparent to-cyan-500/50"></div>
        <h3 class="text-3xl font-bold text-white text-glow">Early Warning Systems & Risk Forecasts</h3>
        <div class="h-[2px] flex-grow bg-gradient-to-l from-transparent to-cyan-500/50"></div>
      </div>
      <div class="grid md:grid-cols-2 gap-8" id="projects-grid">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- TECHNICAL SKILLS & NUMERICAL MODELING -->
    <div class="mb-20">
      <div class="flex items-center gap-4 mb-10 fade-in-up">
        <div class="h-[2px] flex-grow bg-gradient-to-r from-transparent to-cyan-500/50"></div>
        <h3 class="text-3xl font-bold text-white text-glow">Technical Stack & Modeling Expertise</h3>
        <div class="h-[2px] flex-grow bg-gradient-to-l from-transparent to-cyan-500/50"></div>
      </div>
      <div class="grid md:grid-cols-3 gap-6" id="skills-grid">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- SCIENTIFIC ACHIEVEMENTS & CONTRIBUTIONS -->
    <div class="mb-20">
      <div class="flex items-center gap-4 mb-10 fade-in-up">
        <div class="h-[2px] flex-grow bg-gradient-to-r from-transparent to-cyan-500/50"></div>
        <h3 class="text-3xl font-bold text-white text-glow">Riset, Konferensi & Kontribusi Ilmiah</h3>
        <div class="h-[2px] flex-grow bg-gradient-to-l from-transparent to-cyan-500/50"></div>
      </div>
      <div class="glass-panel p-8 rounded-2xl fade-in-up" id="achievements-card">
        <!-- Injected via JS -->
      </div>
    </div>
  </main>

  <footer class="border-t border-cyan-900/50 mt-10 py-8 text-center text-slate-500 text-sm glass-header">
    <p>© 2026 Bagus Primohadi. Geospatial AI & Risk Intelligence Systems.</p>
  </footer>

  <script src="geosains.js"></script>
</body>
</html>
